 leo_mvd_x_elven_settlement_icon: "@leo_mvd_gray_elven_settlement!"
 leo_mvd_x_elven_settlement_text: "[directive|E]: エルフの入植$leo_mvd_exempt_suffix$"
 leo_mvd_ui_cond_23_tt: "[vassal|E]の領域の県が、入植可能な荒野に接している場合に満たされる。\n\n#weak 荒野を開拓するのは、荒野を開拓するよう命じられた臣下だけである。#!"
 leo_mvd_ui_preset_9: "荒野の開拓"
 leo_mvd_ui_preset_9_tt: "王国を荒野へと押し広げます。\n\n#weak 1.#! 領地が荒野に接する[vassals|E]には $leo_mvd_ui_dir_15$ を命じます。\n#weak 2.#! あなたの[faith|E]で他の信仰の県を持つ臣下には $leo_mvd_ui_dir_1$ を命じます。\n#weak 3.#! 残りの臣下はすべて $leo_mvd_ui_dir_9$。\n\n#weak 開拓を行うのは、荒野を開拓するよう命じられた臣下だけです。#!"
 leo_mvd_ui_preset_9_tt_nodlc: "$leo_mvd_ui_preset_9_tt$"
 leo_mvd_ui_preset_10: "エルフの王国"
 leo_mvd_ui_preset_10_tt: "エルフの統治者のために: 王国の他の民をエルフのもとへ迎え入れます。\n\n#weak 1.#! 他の種族の県を持つエルフの[vassals|E]には $leo_mvd_ui_dir_16$ を命じます。\n#weak 2.#! 領地が荒野に接する臣下には $leo_mvd_ui_dir_15$ を命じます。\n#weak 3.#! 残りの臣下はすべて $leo_mvd_ui_dir_9$。\n\n#weak エルフの入植には、あなたと臣下の両方がエルフである必要があります。他の統治者のもとでは最初の段階は飛ばされます。#!"
 leo_mvd_ui_preset_10_tt_nodlc: "$leo_mvd_ui_preset_10_tt$"
 leo_mvd_ui_dir_15: "@leo_mvd_dir_icon_settle_wastelands! 荒野を開拓"
 leo_mvd_ui_dir_16: "@leo_mvd_dir_icon_elven_settlement! エルフの入植"
 leo_mvd_ui_cond_23: "荒野に接する"
 leo_mvd_ui_cond_24: "自分と同じ種族"
