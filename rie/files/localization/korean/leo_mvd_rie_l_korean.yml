l_korean:
 leo_mvd_x_settle_wastelands_icon: "@leo_mvd_gray_settle_wastelands!"
 leo_mvd_x_settle_wastelands_text: "[directive|E]: 황무지 백작령 개척$leo_mvd_exempt_suffix$"
 leo_mvd_x_elven_settlement_icon: "@leo_mvd_gray_elven_settlement!"
 leo_mvd_x_elven_settlement_text: "[directive|E]: 엘프 정착$leo_mvd_exempt_suffix$"
 leo_mvd_ui_cond_23_tt: "[vassal|E]의 영역에 속한 백작령이 정착 가능한 황무지와 맞닿아 있으면 참입니다.\n\n#weak 황무지 개척 지침을 받은 봉신만 그곳을 개척합니다.#!"
 leo_mvd_ui_preset_9: "황무지 개척"
 leo_mvd_ui_preset_9_tt: "왕국을 황무지로 넓혀 나갑니다.\n\n#weak 1.#! 영지가 황무지와 맞닿은 [vassals|E]에게는 $leo_mvd_ui_dir_15$을(를) 지시합니다.\n#weak 2.#! 당신의 [faith|E]을(를) 따르면서 다른 신앙의 백작령을 보유한 봉신에게는 $leo_mvd_ui_dir_1$을(를) 지시합니다.\n#weak 3.#! 나머지 모든 봉신은 $leo_mvd_ui_dir_9$.\n\n#weak 황무지 개척 지침을 받은 봉신만 개척합니다.#!"
 leo_mvd_ui_preset_9_tt_nodlc: "$leo_mvd_ui_preset_9_tt$"
 leo_mvd_ui_preset_10: "엘프 왕국"
 leo_mvd_ui_preset_10_tt: "엘프 통치자를 위해: 왕국의 다른 종족들을 엘프의 품으로 모읍니다.\n\n#weak 1.#! 다른 종족의 백작령을 보유한 엘프 [vassals|E]에게는 $leo_mvd_ui_dir_16$을(를) 지시합니다.\n#weak 2.#! 영지가 황무지와 맞닿은 봉신에게는 $leo_mvd_ui_dir_15$을(를) 지시합니다.\n#weak 3.#! 나머지 모든 봉신은 $leo_mvd_ui_dir_9$.\n\n#weak 엘프 정착은 당신과 봉신이 모두 엘프여야 합니다. 다른 통치자 아래에서는 첫 단계를 건너뜁니다.#!"
 leo_mvd_ui_preset_10_tt_nodlc: "$leo_mvd_ui_preset_10_tt$"
 leo_mvd_ui_dir_15: "@leo_mvd_dir_icon_settle_wastelands! 황무지 개척"
 leo_mvd_ui_dir_16: "@leo_mvd_dir_icon_elven_settlement! 엘프 정착"
 leo_mvd_ui_cond_23: "황무지와 맞닿음"
 leo_mvd_ui_cond_24: "당신과 같은 종족"
 leo_mvd_ui_cond_25: "다른 종족의 [counties|E] 보유"
 leo_mvd_ui_cond_24_tt: ""
 leo_mvd_ui_cond_25_tt: ""
