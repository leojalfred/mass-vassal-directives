l_russian:
 leo_mvd_x_settle_wastelands_icon: "@leo_mvd_gray_settle_wastelands!"
 leo_mvd_x_settle_wastelands_text: "[directive|E]: Заселять дикие земли$leo_mvd_exempt_suffix$"
 leo_mvd_x_elven_settlement_icon: "@leo_mvd_gray_elven_settlement!"
 leo_mvd_x_elven_settlement_text: "[directive|E]: Эльфийское поселение$leo_mvd_exempt_suffix$"
 leo_mvd_ui_cond_23_tt: "Выполняется, если графство в державе [vassal|E] граничит с дикими землями, которые можно заселить.\n\n#weak Осваивает их только вассал, получивший директиву Заселять дикие земли.#!"
 leo_mvd_ui_preset_9: "Освоить дикие земли"
 leo_mvd_ui_preset_9_tt: "Продвигайте державу в дикие земли.\n\n#weak 1.#! [vassals|E], чьи земли граничат с дикими землями, велено $leo_mvd_ui_dir_15$.\n#weak 2.#! Вассалам вашей [faith|E], владеющим графствами иной, велено $leo_mvd_ui_dir_1$.\n#weak 3.#! Все остальные вассалы $leo_mvd_ui_dir_9$.\n\n#weak Осваивает земли только вассал, получивший директиву Заселять дикие земли.#!"
 leo_mvd_ui_preset_9_tt_nodlc: "$leo_mvd_ui_preset_9_tt$"
 leo_mvd_ui_preset_10: "Эльфийская держава"
 leo_mvd_ui_preset_10_tt: "Для эльфийского правителя: соберите прочие народы державы под крыло эльфов.\n\n#weak 1.#! Эльфийским [vassals|E], владеющим графствами иной расы, велено $leo_mvd_ui_dir_16$.\n#weak 2.#! Вассалам, чьи земли граничат с дикими землями, велено $leo_mvd_ui_dir_15$.\n#weak 3.#! Все остальные вассалы $leo_mvd_ui_dir_9$.\n\n#weak Эльфийское поселение требует, чтобы и вы, и вассал были эльфами. При любом другом правителе первый шаг пропускается.#!"
 leo_mvd_ui_preset_10_tt_nodlc: "$leo_mvd_ui_preset_10_tt$"
 leo_mvd_ui_dir_15: "@leo_mvd_dir_icon_settle_wastelands! Заселять дикие земли"
 leo_mvd_ui_dir_16: "@leo_mvd_dir_icon_elven_settlement! Эльфийское поселение"
 leo_mvd_ui_cond_23: "Граничит с дикими землями"
 leo_mvd_ui_cond_24: "Той же расы, что и вы"
 leo_mvd_ui_cond_25: "Держит [counties|E] иной расы"
 leo_mvd_ui_cond_24_tt: ""
 leo_mvd_ui_cond_25_tt: ""
