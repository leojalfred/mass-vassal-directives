 leo_mvd_ui_cond_23_tt: "Wahr, wenn eine Grafschaft im Reich des [vassal|E] an Wildnis grenzt, die besiedelt werden könnte.\n\n#weak Nur ein Vasall mit der Anweisung Die Wildnis besiedeln besiedelt sie je.#!"
 leo_mvd_ui_preset_9: "Die Wildnis erschließen"
 leo_mvd_ui_preset_9_tt: "Dränge das Reich hinaus in die Wildnis.\n\n#weak 1.#! [vassals|E], deren Land an die Wildnis grenzt, sollen $leo_mvd_ui_dir_15$.\n#weak 2.#! Vasallen deines [faith|E], die Grafschaften eines anderen halten, sollen $leo_mvd_ui_dir_1$.\n#weak 3.#! Alle übrigen Vasallen $leo_mvd_ui_dir_9$.\n\n#weak Nur ein Vasall mit der Anweisung Die Wildnis besiedeln besiedelt je.#!"
 leo_mvd_ui_preset_9_tt_nodlc: "$leo_mvd_ui_preset_9_tt$"
 leo_mvd_ui_preset_10: "Elbenreich"
 leo_mvd_ui_preset_10_tt: "Für einen elbischen Herrscher: Hole die anderen Völker des Reiches in den Schoß der Elben.\n\n#weak 1.#! Elbische [vassals|E], die Grafschaften eines anderen Volkes halten, sollen $leo_mvd_ui_dir_16$.\n#weak 2.#! Vasallen, deren Land an die Wildnis grenzt, sollen $leo_mvd_ui_dir_15$.\n#weak 3.#! Alle übrigen Vasallen $leo_mvd_ui_dir_9$.\n\n#weak Die Elbische Siedlung verlangt, dass du und der Vasall beide Elben seid. Unter jedem anderen Herrscher wird der erste Schritt übersprungen.#!"
 leo_mvd_ui_preset_10_tt_nodlc: "$leo_mvd_ui_preset_10_tt$"
