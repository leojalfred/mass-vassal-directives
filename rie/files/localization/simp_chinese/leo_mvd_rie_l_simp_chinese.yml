l_simp_chinese:
 leo_mvd_x_settle_wastelands_icon: "@leo_mvd_gray_settle_wastelands!"
 leo_mvd_x_settle_wastelands_text: "[directive|E]：开拓荒野伯爵领$leo_mvd_exempt_suffix$"
 leo_mvd_x_elven_settlement_icon: "@leo_mvd_gray_elven_settlement!"
 leo_mvd_x_elven_settlement_text: "[directive|E]：精灵定居$leo_mvd_exempt_suffix$"
 leo_mvd_ui_cond_23_tt: "当[vassal|E]领域内的某个伯爵领与可供定居的荒野相邻时成立。\n\n#weak 只有被要求开拓荒野的封臣才会去开拓。#!"
 leo_mvd_ui_preset_9: "开拓荒野"
 leo_mvd_ui_preset_9_tt: "将王国推进荒野。\n\n#weak 1.#! 领地与荒野相邻的[vassals|E]，被要求$leo_mvd_ui_dir_15$。\n#weak 2.#! 与你同[faith|E]、却持有他信仰领地的封臣，被要求$leo_mvd_ui_dir_1$。\n#weak 3.#! 其余所有封臣$leo_mvd_ui_dir_9$。\n\n#weak 只有被要求开拓荒野的封臣才会去开拓。#!"
 leo_mvd_ui_preset_9_tt_nodlc: "$leo_mvd_ui_preset_9_tt$"
 leo_mvd_ui_preset_10: "精灵王国"
 leo_mvd_ui_preset_10_tt: "为精灵统治者而设：将王国中的其他种族纳入精灵之中。\n\n#weak 1.#! 持有他种族领地的精灵[vassals|E]，被要求$leo_mvd_ui_dir_16$。\n#weak 2.#! 领地与荒野相邻的封臣，被要求$leo_mvd_ui_dir_15$。\n#weak 3.#! 其余所有封臣$leo_mvd_ui_dir_9$。\n\n#weak 精灵定居要求你与该封臣都是精灵。在其他统治者治下，第一步会被跳过。#!"
 leo_mvd_ui_preset_10_tt_nodlc: "$leo_mvd_ui_preset_10_tt$"
 leo_mvd_ui_dir_15: "@leo_mvd_dir_icon_settle_wastelands! 开拓荒野"
 leo_mvd_ui_dir_16: "@leo_mvd_dir_icon_elven_settlement! 精灵定居"
 leo_mvd_ui_cond_23: "与荒野相邻"
 leo_mvd_ui_cond_24: "与你同种族"
 leo_mvd_ui_cond_25: "持有他种族的[counties|E]"
