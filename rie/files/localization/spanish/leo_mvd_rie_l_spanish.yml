l_spanish:
 leo_mvd_x_settle_wastelands_icon: "@leo_mvd_gray_settle_wastelands!"
 leo_mvd_x_settle_wastelands_text: "[directive|E]: Colonizar condados salvajes$leo_mvd_exempt_suffix$"
 leo_mvd_x_elven_settlement_icon: "@leo_mvd_gray_elven_settlement!"
 leo_mvd_x_elven_settlement_text: "[directive|E]: Asentamiento élfico$leo_mvd_exempt_suffix$"
 leo_mvd_ui_cond_23_tt: "Se cumple cuando un condado del reino del [vassal|E] linda con tierras salvajes que podrían colonizarse.\n\n#weak Solo un vasallo al que se le ordene Colonizar las tierras salvajes llega a colonizarlas.#!"
 leo_mvd_ui_preset_9: "Colonizar las tierras salvajes"
 leo_mvd_ui_preset_9_tt: "Empuja el reino hacia las tierras salvajes.\n\n#weak 1.#! A los [vassals|E] cuyas tierras lindan con las tierras salvajes se les ordena $leo_mvd_ui_dir_15$.\n#weak 2.#! A los vasallos de tu [faith|E] que posean condados de otra se les ordena $leo_mvd_ui_dir_1$.\n#weak 3.#! Todos los vasallos restantes $leo_mvd_ui_dir_9$.\n\n#weak Solo un vasallo al que se le ordene Colonizar las tierras salvajes llega a colonizar.#!"
 leo_mvd_ui_preset_9_tt_nodlc: "$leo_mvd_ui_preset_9_tt$"
 leo_mvd_ui_preset_10: "Reino élfico"
 leo_mvd_ui_preset_10_tt: "Para un gobernante elfo: reúne a los demás pueblos del reino en el seno de los elfos.\n\n#weak 1.#! A los [vassals|E] elfos que posean condados de otra raza se les ordena $leo_mvd_ui_dir_16$.\n#weak 2.#! A los vasallos cuyas tierras lindan con las tierras salvajes se les ordena $leo_mvd_ui_dir_15$.\n#weak 3.#! Todos los vasallos restantes $leo_mvd_ui_dir_9$.\n\n#weak El Asentamiento élfico exige que tanto tú como el vasallo sean elfos. Con cualquier otro gobernante, el primer paso se omite.#!"
 leo_mvd_ui_preset_10_tt_nodlc: "$leo_mvd_ui_preset_10_tt$"
 leo_mvd_ui_dir_15: "@leo_mvd_dir_icon_settle_wastelands! Colonizar las tierras salvajes"
 leo_mvd_ui_dir_16: "@leo_mvd_dir_icon_elven_settlement! Asentamiento élfico"
 leo_mvd_ui_cond_23: "Linda con las tierras salvajes"
 leo_mvd_ui_cond_24: "Misma raza que tú"
 leo_mvd_ui_cond_25: "Posee [counties|E] de otra raza"
 leo_mvd_ui_cond_24_tt: ""
 leo_mvd_ui_cond_25_tt: ""
