l_french:
 leo_mvd_x_settle_wastelands_icon: "@leo_mvd_gray_settle_wastelands!"
 leo_mvd_x_settle_wastelands_text: "[directive|E] : Coloniser les comtés sauvages$leo_mvd_exempt_suffix$"
 leo_mvd_x_elven_settlement_icon: "@leo_mvd_gray_elven_settlement!"
 leo_mvd_x_elven_settlement_text: "[directive|E] : Colonie elfique$leo_mvd_exempt_suffix$"
 leo_mvd_ui_cond_23_tt: "Vrai lorsqu'un comté du royaume du [vassal|E] borde des terres sauvages qui pourraient être colonisées.\n\n#weak Seul un vassal ayant reçu Coloniser les terres sauvages les colonise.#!"
 leo_mvd_ui_preset_9: "Coloniser les terres sauvages"
 leo_mvd_ui_preset_9_tt: "Repoussez le royaume dans les terres sauvages.\n\n#weak 1.#! Les [vassals|E] dont les terres bordent les terres sauvages reçoivent l'ordre de $leo_mvd_ui_dir_15$.\n#weak 2.#! Les vassaux de votre [faith|E] tenant des comtés d'une autre reçoivent l'ordre de $leo_mvd_ui_dir_1$.\n#weak 3.#! Tous les vassaux restants $leo_mvd_ui_dir_9$.\n\n#weak Seul un vassal ayant reçu Coloniser les terres sauvages colonise.#!"
 leo_mvd_ui_preset_9_tt_nodlc: "$leo_mvd_ui_preset_9_tt$"
 leo_mvd_ui_preset_10: "Royaume elfique"
 leo_mvd_ui_preset_10_tt: "Pour un souverain elfe : rassemblez les autres peuples du royaume au sein des elfes.\n\n#weak 1.#! Les [vassals|E] elfes tenant des comtés d'une autre race reçoivent l'ordre de $leo_mvd_ui_dir_16$.\n#weak 2.#! Les vassaux dont les terres bordent les terres sauvages reçoivent l'ordre de $leo_mvd_ui_dir_15$.\n#weak 3.#! Tous les vassaux restants $leo_mvd_ui_dir_9$.\n\n#weak La Colonie elfique exige que vous et le vassal soyez tous deux des elfes. Sous tout autre souverain, la première étape est ignorée.#!"
 leo_mvd_ui_preset_10_tt_nodlc: "$leo_mvd_ui_preset_10_tt$"
 leo_mvd_ui_dir_15: "@leo_mvd_dir_icon_settle_wastelands! Coloniser les terres sauvages"
 leo_mvd_ui_dir_16: "@leo_mvd_dir_icon_elven_settlement! Colonie elfique"
 leo_mvd_ui_cond_23: "Borde les terres sauvages"
 leo_mvd_ui_cond_24: "Même race que vous"
 leo_mvd_ui_cond_25: "Tient des [counties|E] d'une autre race"
 leo_mvd_ui_cond_24_tt: ""
 leo_mvd_ui_cond_25_tt: ""
